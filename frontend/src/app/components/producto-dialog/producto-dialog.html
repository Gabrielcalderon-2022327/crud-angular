<div class="dialog-container">
  <div class="dialog-header">
    <div class="header-icon">
      <mat-icon>add_shopping_cart</mat-icon>
    </div>
    <div>
      <h2 mat-dialog-title>Nuevo Producto</h2>
      <p class="subtitle">Completa los datos para agregarlo al inventario</p>
    </div>
  </div>

  <mat-dialog-content>
    <form [formGroup]="productoForm" class="formulario">

      <mat-form-field appearance="outline" class="campo-completo">
        <mat-label>Nombre del Producto</mat-label>
        <input matInput formControlName="producto" placeholder="Ej: Coca Cola">
        <mat-icon matSuffix>inventory_2</mat-icon>
      </mat-form-field>

      <div class="fila-doble">
        <mat-form-field appearance="outline">
          <mat-label>Precio</mat-label>
          <span matTextPrefix>Q.&nbsp;</span>
          <input matInput type="number" formControlName="precio" min="0" step="0.01">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Cantidad</mat-label>
          <input matInput type="number" formControlName="cantidad" min="0">
          <mat-icon matSuffix>numbers</mat-icon>
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="acciones">
    <button mat-stroked-button (click)="onCancelar()">
      <mat-icon>close</mat-icon>
      Cancelar
    </button>
    <button mat-flat-button color="primary" (click)="onGuardar()" [disabled]="productoForm.invalid">
      <mat-icon>save</mat-icon>
      Guardar
    </button>
  </mat-dialog-actions>
</div>
